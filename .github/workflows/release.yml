name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 floor. ubuntu-latest is already 26.04.
          - os: ubuntu-22.04
            name: Linux x86_64
            artifact: linux-x86_64
            bin: target/release/coda
          - os: macos-latest
            name: macOS Apple Silicon
            artifact: macos-aarch64
            bin: target/release/coda
          - os: windows-latest
            name: Windows x86_64
            artifact: windows-x86_64
            bin: target/release/coda.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.artifact == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name the downloads
        run: |
          ver="${GITHUB_REF_NAME}"
          mkdir -p out
          cp dist/linux-x86_64/coda "out/coda-${ver}-linux-x86_64"
          cp dist/macos-aarch64/coda "out/coda-${ver}-macos-aarch64"
          cp dist/windows-x86_64/coda.exe "out/coda-${ver}-windows-x86_64.exe"
          chmod 755 "out/coda-${ver}-linux-x86_64" "out/coda-${ver}-macos-aarch64"
          (cd out && sha256sum ./* > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME}"
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Download the file for your system. That file is the program.

          The "Source code" archives on this page are the code, not the player.

          - Linux x86_64: \`coda-${ver}-linux-x86_64\`
            Needs \`libasound.so.2\`, \`libdbus-1.so.3\`, and glibc 2.35 or newer.
          - macOS Apple Silicon: \`coda-${ver}-macos-aarch64\`
          - Windows x86_64: \`coda-${ver}-windows-x86_64.exe\`

          \`SHA256SUMS\` is the checksum of each file.

          \`\`\`bash
          chmod +x coda-${ver}-linux-x86_64
          install -m 755 coda-${ver}-linux-x86_64 ~/.local/bin/coda
          \`\`\`
          EOF
          gh release create "$ver" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "coda ${ver}" \
            --notes-file "$notes" \
            out/*
