name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    # Pinned for a glibc 2.35 floor. ubuntu-latest is already 26.04 and would
    # lock the download to a much newer C library.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --locked

      - name: Pack the binary
        run: |
          asset="coda-${GITHUB_REF_NAME}-linux-x86_64"
          cp target/release/coda "$asset"
          chmod 755 "$asset"
          sha256sum "$asset" > "${asset}.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="coda-${GITHUB_REF_NAME}-linux-x86_64"
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Download \`${asset}\`. That file is the program.

          The "Source code" archives on this page are the code, not the player.

          Runtime libraries: \`libasound.so.2\` and \`libdbus-1.so.3\`.
          glibc 2.35 or newer (Ubuntu 22.04, Fedora 35, and later).

          \`\`\`bash
          chmod +x ${asset}
          install -m 755 ${asset} ~/.local/bin/coda
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "coda ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            "$asset" \
            "${asset}.sha256"
